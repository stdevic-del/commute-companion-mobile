name: Osvezi servisne izvore (EDS, BVK, GSP, Radovi, Parking, OSM Ulice)

on:
  schedule:
    # Pre jutarnjeg spica (05:15 UTC = 06:15/07:15 BG), u podne, pred popodnevni spic i uvece
    - cron: '15 5,11,15,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  osvezi:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi repozitorijum
        uses: actions/checkout@v4

      - name: Postavi Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Jednokratni uvoz svih beogradskih ulica iz OSM Overpass API-ja (ako fajl jos ne postoji)
        run: |
          if [ ! -f "public/data/ulice_beograd.json" ] && [ ! -f "data/ulice_beograd.json" ]; then
            python3 scrapers/uvezi_osm_ulice.py
          fi

      - name: Osvezi EDS, BVK, GSP, Radove i Parking podatke
        run: |
          if [ -d "public" ]; then
            python3 scrapers/osvezi_servise.py public/data/servisi.json
          else
            python3 scrapers/osvezi_servise.py data/servisi.json
          fi

      - name: Sacuvaj izmenu ako ima novih podataka
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nema promena u servisnim izvorima."
          else
            git commit -m "chore(servisi): automatsko osvezavanje servisa i OSM baze ulica"
            git push
          fi

